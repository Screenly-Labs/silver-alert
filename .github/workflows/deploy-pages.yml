---
name: Deploy to GitHub Pages

# Deploys the board together with a fresh scrape of FDLE's current Silver
# Alerts. A CalVer tag ships new code; the hourly schedule re-scrapes and
# re-deploys the latest tag, so the published alerts are never more than about
# an hour old. If the scrape fails any safeguard the job fails before the
# deploy step, nothing is published, and the board stops trusting the previous
# deploy once it is MAX_DATA_AGE_MS old (assets/static/js/alerts.ts).
on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].*'
  schedule:
    # Off the top of the hour, when GitHub's scheduler is busiest.
    - cron: '17 * * * *'
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages and mint the OIDC token it needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and scrape
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      # Scheduled runs start from master; ship the latest release instead, so
      # the hourly refresh never deploys unreleased code.
      - name: Check out the latest release
        if: github.event_name == 'schedule'
        run: |
          tag=$(git tag --list '[0-9][0-9][0-9][0-9].*' --sort=-v:refname | head -n 1)
          if [ -z "$tag" ]; then
            echo "::error::No release tag yet; push a CalVer tag first."
            exit 1
          fi
          echo "Deploying $tag"
          git checkout --quiet "$tag"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck (tsc)
        run: bun run typecheck
      - name: Lint (Biome)
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Scrape FDLE Silver Alerts
        run: bun run scrape
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
